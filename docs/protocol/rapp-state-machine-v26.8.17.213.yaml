protocol: RAPP
document_version: "26.8.17.213"
supersedes: "26.8.17.135"
wire_version: "26.8"
status: external-review

semantics:
  instances: >
    Machines describe instances, not singletons. A pairing instance exists per
    live or in-progress peer relationship and is never stored at rest; unpaired
    is the absence of one. A session instance exists per pairing: it is the
    pairing's authenticated channel continuing past confirmation, and absent
    means confirmation has not completed. An operation instance exists
    per operation_id; none is the admission state of a new instance, and
    terminal states are journal records, held only for the life of the
    connection, that accept no further transitions.
  roles: >
    Every transition names a role: requester, proxy, or both. An endpoint
    implements exactly the transitions whose role includes it. States occupied
    by one role only are marked on the state list.
  from_lists: "a list-valued from is shorthand for one rule per listed state"
  no_wildcards: >
    There are no wildcard transitions. Any input without a matching transition
    from the current state is handled by exactly one unexpected_input_policy
    class, which is part of this model and of generated tests.
  guard_failure: >
    A failed guard on a transition triggered by an authenticated peer message
    produces the bounded response named by the failure taxonomy (for example
    the reserved error on operation admission) and leaves state unchanged. A
    failed guard on a local event is a no-op.
  actions_are_ordered: true
  event_precedence: >
    Racing events are processed in the order of the prose Section 14.7: local
    forget, revocation, or security shutdown; authenticated peer revocation
    notice; credential rejection or card ambiguity;
    authenticated peer close; transport loss, integrity failure, or liveness
    deadline; operation transitions; liveness traffic.

constants:
  max_active_operations: 1
  minimum_remaining_attempts: 3
  maximum_credential_transmissions_per_operation: 1
  offer_ttl_max_ms: 180000
# candidate_failure_hint_threshold removed: with no re-dial there are no
# repeated candidate authentication failures to count.

guards:
  user_initiated: "an explicit local user action started this event"
  local_user_action: "the event originates from the local user, never the peer"
  offer_valid_and_supported: >
    the scanned offer parses within size limits with a supported version,
    suite, profile intersection, and permitted transport candidate
  offer_live: "the offer is unexpired, uncancelled, and not yet consumed"
  transcript_matches: >
    the completed handshake used the expected prologue and empty handshake
    payloads
  granted_sets_equal: "both pairing.confirm granted_profiles sets are equal"
  deadline_not_expired: "the liveness hard deadline has not passed"
  admission_permitted: >
    session healthy, profile granted, and no operation instance in an active
    state
  hash_echo_matches: "the echoed request_hash equals the journaled value"
  hash_matches: "the commit request_hash equals the prepared request"
  zero_transmissions: "the physical credential transmission count is zero"
  proven_no_transmission: "zero physical transmissions is provable"
  profile_has_no_consequential_command: "the profile defines no consequential command for this action"

actions:
  generate_offer_id: "create a random 32-byte offer identifier"
  generate_pairing_secret: "create the random 32-byte bearer secret"
  start_offer_expiry: "start the monotonic offer expiry, clamped to offer_ttl_max_ms"
  display_qr: "render the offer QR on the requester"
  hide_qr: "remove the offer QR from display"
  select_one_candidate: "choose exactly one offered transport candidate"
  connect_candidate: "open the selected candidate transport"
  prepare_pairing_responder: "arm the pairing handshake in the responder role"
  begin_pairing_handshake_initiator: "start the pairing handshake in the initiator role"
  derive_channel_identifiers: "derive session_id and pair_id from the one handshake hash"
  destroy_pairing_secret: "erase the bearer secret from memory"
  stop_accepting_candidates: "requester stops accepting further candidates for the offer"
  send_pairing_hello: "send pairing.hello with the negotiated-parameter echo"
  show_peer_and_requested_grants: "display peer identity labels and requested profiles"
  discard_candidate: "drop the candidate connection and its handshake state"
  retain_offer: "keep the offer live for further candidates"
  invalidate_offer: "mark the offer permanently unusable"
  close_candidate: "close the candidate transport connection"
  hold_pair_record_in_memory: "hold pair keys, pair_id, granted profiles, and metadata in memory for the life of the connection; never persist them at rest"
  send_pairing_abort_best_effort: "send pairing.abort if the channel is usable"
  destroy_candidate_keys: "erase unstored static and ephemeral candidate keys"
  show_connected: "expose the Connected visible state"
  show_checking: "expose the Checking connection visible state"
  show_disconnecting: "expose the Disconnecting visible state"
  show_connection_stopped: "expose the Connection stopped visible state"
  show_terminated: "expose a transient pairing-terminated notice; there is no persistent revoked state"
  close_session: "raise close_requested_by_pairing for the live session instance"
  destroy_pair_keys: "erase pair static keys from memory"
  clear_pair_metadata: "erase in-memory names, grants, and pair metadata"
  record_peer_initiated: "record that the peer initiated the termination"
  send_close_best_effort: "send session.close with the transition's reason if the channel is usable"
  start_authenticated_liveness: "start the liveness schedule"
  block_new_operations: "refuse operation admission until healthy"
  start_backoff_and_deadline: "start liveness backoff with jitter and the hard deadline"
  reset_backoff: "clear liveness backoff state"
  record_peer_close_reason: "journal the received close reason"
  note_close_notice_impossible: "record that no close notice can be sent"
  proceed_without_close_notice: "continue closing without further sends"
  destroy_session_material: "erase session keys, handshake state, and buffers"
  destroy_credential_buffers: "erase any credential buffers tied to the session"
  persist_terminal_session_record: "journal the terminal session record"
  validate_schema_hash_expiry_and_context: "validate request schema, request_hash, expiry, and context"
  start_expiry_clock: "start the monotonic expires_after_ms clock"
  begin_safe_prerequisite_reads: "run the profile's bounded safe reads, including secure-channel establishment"
  present_consent_per_profile: "present the profile-defined consent context"
  dismiss_consent: "remove the consent prompt"
  clear_operation_credentials: "zeroize credentials collected for this operation"
  clear_all_active_credentials: "zeroize every credential value and command buffer in the flow"
  remove_rejected_credential_and_derived_state: >
    remove the cached rejected credential; for CAN also remove stored CAN and
    card-derived identity state
  send_prepared: "send operation.prepared with the request_hash echo"
  send_result_completed: "send operation.result with status completed"
  send_result_denied: "send operation.result with status denied"
  send_result_cancelled: "send operation.result with status cancelled"
  send_result_rejected: "send operation.result with status rejected"
  send_result_retry_policy_refused: "send operation.result status rejected, error retry_policy_refused"
  send_result_credential_rejected_best_effort: "send the bounded credential_rejected result if the channel is usable"
  send_result_ambiguous_best_effort: "send operation.result status ambiguous if the channel is usable"
  request_session_close: "raise local_close_requested for the session"
  request_session_close_credential_rejected: "raise credential_rejected for the session"
  revoke_pair_after_credential_rejection: "destroy the in-memory pair keys after sealing the bounded credential_rejected result, or immediately when receiving that authenticated result; no record is written at rest. The proxy's own card credentials are outside RAPP and are not touched"
  request_session_close_ambiguous: "raise card_completion_ambiguous for the session"
  send_operation_cancel: "send operation.cancel with the request_hash echo"
  durably_write_commit_before_transmission: "write the non-secret commit record before any transmission"
  consume_non_clonable_command: "consume the one-shot command object"
  increment_transmission_count_once: "increment the physical transmission count exactly once"
  record_advisory_cancel: "journal the advisory cancel without interrupting the card exchange"
  continue_card_exchange_locally: "let the card exchange finish; never interrupt or repeat it"
  note_result_delivery_impossible: "record that no session exists for result delivery"
  persist_result: "journal the card result durably"
  persist_rejection: "journal the rejection durably"
  persist_cancelled: "journal cancelled with proven zero transmissions"
  persist_ambiguous: "journal ambiguous durably"
  persist_completed: "journal completed durably"
  persist_delivery_uncertain: "journal delivery_uncertain durably"
  retain_result_under_local_storage: "keep the result encrypted under local platform storage"
  release_result: "release the result to the requesting application"
  prohibit_retry: "mark automatic retry permanently false for this operation_id"
  prohibit_card_retry: "mark the card command as never repeatable for this operation_id"
  compute_request_hash: "compute request_hash over the defined preimage"
  journal_request: "journal the sent request"
  journal_prepared: "journal the prepared acknowledgment"
  journal_commit_intent_durably: "journal the commit intent before sending commit"
  journal_completed: "journal completed"
  journal_denied: "journal denied"
  journal_cancelled: "journal cancelled"
  journal_rejected: "journal rejected"
  journal_credential_rejected: "journal credential_rejected"
  journal_ambiguous: "journal ambiguous"
  send_result_ack: "send operation.result_ack with the request_hash echo"

pairing:
  initial: unpaired
  states:
    - unpaired
    - offer_active          # requester only
    - handshaking
    - confirming
    - paired_connected
  notes:
    - "A pairing exists only as paired_connected: a live, liveness-maintained connection. There is no state in which a pairing persists without a live session. Any loss of that session -- forget, revocation, an authenticated violation, a peer close, transport loss, or the liveness hard deadline -- returns to unpaired and destroys the pair keys on both peers. Nothing pairing-related is stored at rest, and a dropped pairing is never re-established automatically: recovery is a fresh QR pairing ceremony, never a reconnect to a remembered pairing. The proxy's own card credentials -- CAN, PINs, activation state, identity -- are held in its durable store for its local card use and are outside RAPP's lifecycle; RAPP never touches them."
    - "forget during offer, handshake, or confirmation is expressed by offer_expired_or_cancelled and denied_aborted_or_timed_out"
    - "peer_revocation_notice requires an authenticated channel, so it can occur only in paired_connected"
  transitions:
    - from: unpaired
      event: create_offer
      role: requester
      guard: user_initiated
      to: offer_active
      actions: [generate_offer_id, generate_pairing_secret, start_offer_expiry, display_qr]
    - from: unpaired
      event: offer_scanned
      role: proxy
      guard: offer_valid_and_supported
      to: handshaking
      actions: [select_one_candidate, connect_candidate, prepare_pairing_responder]
    - from: offer_active
      event: candidate_connected
      role: requester
      guard: offer_live
      to: handshaking
      actions: [begin_pairing_handshake_initiator]
    - from: offer_active
      event: offer_expired_or_cancelled
      role: requester
      to: unpaired
      actions: [destroy_pairing_secret, invalidate_offer, hide_qr]
    - from: handshaking
      event: handshake_authenticated
      role: both
      guard: transcript_matches
      to: confirming
      actions: [derive_channel_identifiers, destroy_pairing_secret, stop_accepting_candidates, hide_qr, send_pairing_hello, show_peer_and_requested_grants]
    - from: handshaking
      event: handshake_failed
      role: requester
      to: offer_active
      actions: [discard_candidate, retain_offer]
    - from: handshaking
      event: handshake_failed
      role: proxy
      to: unpaired
      actions: [discard_candidate]
    - from: handshaking
      event: offer_expired_or_cancelled
      role: requester
      to: unpaired
      actions: [destroy_pairing_secret, invalidate_offer, close_candidate]
    # There is no second handshake: the authenticated pairing channel
    # continues as the live session. Entering paired_connected produces
    # pairing_confirmed, which creates the session instance directly in
    # healthy on this same channel. The pair record is held only in memory
    # for the life of that connection.
    - from: confirming
      event: both_users_confirmed
      role: both
      guard: granted_sets_equal
      to: paired_connected
      actions: [hold_pair_record_in_memory, invalidate_offer]
    - from: confirming
      event: denied_aborted_or_timed_out
      role: both
      to: unpaired
      actions: [send_pairing_abort_best_effort, destroy_candidate_keys, invalidate_offer, close_candidate]
    # Any close of the live session -- ordinary loss, the liveness hard
    # deadline, user disconnect, or a peer close -- ends the pairing. There is
    # nothing preserved to reconnect to.
    - from: paired_connected
      event: session_closed             # produced by the session machine entering closed for any reason
      role: both
      to: unpaired
      actions: [destroy_pair_keys, clear_pair_metadata]
    - from: paired_connected
      event: forget_pairing
      role: both
      guard: local_user_action
      to: unpaired
      actions: [close_session, destroy_pair_keys, clear_pair_metadata]
    - from: paired_connected
      event: authenticated_protocol_violation
      role: both
      to: unpaired
      actions: [send_close_best_effort, close_session, destroy_pair_keys, show_terminated]
    - from: paired_connected
      event: local_revoke
      role: both
      guard: local_user_action
      to: unpaired
      actions: [send_close_best_effort, close_session, destroy_pair_keys, show_terminated]
    - from: paired_connected
      event: peer_revocation_notice     # produced by peer_close_received with reason pairing_revoked or protocol_violation
      role: both
      to: unpaired
      actions: [record_peer_initiated, close_session, destroy_pair_keys, show_terminated]

session:
  initial: absent
  # There is no separate session establishment: the authenticated pairing
  # channel continues as the live session. pairing_confirmed (produced by the
  # pairing machine entering paired_connected) creates the instance directly
  # in healthy. Pre-confirmation channel failures belong to the pairing
  # machine, not to this one.
  states:
    - absent
    - healthy
    - checking
    - closing
    - closed
  notes:
    - "the session instance is the pairing's authenticated channel continuing past confirmation; there is no connect or handshake phase of its own"
    - "entering healthy produces session_healthy; entering closed after healthy was reached produces session_closed"
    - "entering closing produces session_closed_pre_commit, session_closed_post_commit, or session_closed_before_ack for the active operation per rules X-02 through X-05"
    - "closed is terminal for the instance and, because the pairing is this connection, for the pairing; a new instance requires a new pairing ceremony"
  transitions:
    - from: absent
      event: pairing_confirmed          # produced by the pairing machine entering paired_connected
      role: both
      to: healthy
      actions: [start_authenticated_liveness, show_connected]
    - from: healthy
      event: liveness_missed
      role: both
      to: checking
      actions: [block_new_operations, start_backoff_and_deadline, show_checking]
    - from: checking
      event: liveness_restored
      role: both
      guard: deadline_not_expired
      to: healthy
      actions: [reset_backoff, show_connected]
    - from: checking
      event: liveness_deadline_expired
      role: both
      to: closing
      actions: [show_disconnecting]
    - from: [healthy, checking]
      event: user_disconnect
      role: both
      to: closing
      actions: [send_close_best_effort, show_disconnecting]
    - from: [healthy, checking]
      event: local_close_requested      # produced by operation action request_session_close
      role: both
      to: closing
      actions: [send_close_best_effort, show_disconnecting]
    - from: [healthy, checking]
      event: peer_close_received
      role: both
      to: closing
      actions: [record_peer_close_reason, show_disconnecting]
    - from: closing
      event: peer_close_received
      role: both
      to: closing
      actions: []
    - from: [healthy, checking]
      event: credential_rejected        # produced by operation action request_session_close_credential_rejected
      role: proxy
      to: closing
      actions: [destroy_pair_keys, show_terminated, send_close_best_effort, show_disconnecting]
    - from: [healthy, checking]
      event: card_completion_ambiguous
      role: proxy
      to: closing
      actions: [show_disconnecting]
    - from: [healthy, checking]
      event: transport_failed
      role: both
      to: closing
      actions: [note_close_notice_impossible, show_disconnecting]
    - from: [healthy, checking]
      event: session_integrity_failed   # policy class 2; no pairing effect
      role: both
      to: closing
      actions: [note_close_notice_impossible, show_disconnecting]
    - from: [healthy, checking]
      event: authenticated_protocol_violation   # policy class 4
      role: both
      to: closing
      actions: [send_close_best_effort, show_disconnecting]
    - from: [healthy, checking]
      event: close_requested_by_pairing # produced by pairing actions and rule X-01
      role: both
      to: closing
      actions: [show_disconnecting]
    - from: [healthy, checking]
      event: local_security_shutdown    # policy class 5
      role: both
      to: closing
      actions: [note_close_notice_impossible, show_disconnecting]
    - from: closing
      event: transport_failed
      role: both
      to: closing
      actions: [proceed_without_close_notice]
    - from: closing
      event: close_complete_or_deadline
      role: both
      to: closed
      actions: [destroy_session_material, destroy_credential_buffers, persist_terminal_session_record, show_connection_stopped]

operation:
  initial: none
  states:
    - none
    - requested
    - awaiting_consent      # proxy only
    - prepared
    - committed
    - executing             # proxy only
    - result_pending        # proxy only
    - completed
    - denied
    - cancelled
    - rejected
    - credential_rejected
    - ambiguous
    - delivery_uncertain
  terminal:
    - completed
    - denied
    - cancelled
    - rejected
    - credential_rejected
    - ambiguous
    - delivery_uncertain
  notes:
    - "messages referencing an unknown or terminal operation_id are stale-reference races, policy class 3, and transition nothing"
    - "an authenticated status report may annotate a terminal journal record; it never transitions any state"
    - "protocol violations transition the session; the operation is then classified by the session_closed_* events alone"
  transitions:
    - from: none
      event: operation_request_sent
      role: requester
      guard: admission_permitted
      to: requested
      actions: [compute_request_hash, journal_request, start_expiry_clock]
    - from: none
      event: operation_request_received
      role: proxy
      guard: admission_permitted
      to: requested
      actions: [validate_schema_hash_expiry_and_context, start_expiry_clock]
    - from: requested
      event: request_valid
      role: proxy
      to: awaiting_consent
      actions: [begin_safe_prerequisite_reads, present_consent_per_profile]
    - from: requested
      event: request_invalid_or_unsupported
      role: proxy
      to: rejected
      actions: [send_result_rejected]
    - from: [requested, awaiting_consent]
      event: cancel_received
      role: proxy
      to: cancelled
      actions: [clear_operation_credentials, dismiss_consent, send_result_cancelled]
    - from: [requested, awaiting_consent]
      event: request_expired
      role: proxy
      to: cancelled
      actions: [clear_operation_credentials, dismiss_consent, send_result_cancelled]
    - from: awaiting_consent
      event: user_denied
      role: proxy
      to: denied
      actions: [clear_operation_credentials, send_result_denied]
    - from: awaiting_consent
      event: retry_policy_refused
      role: proxy
      to: rejected
      actions: [clear_operation_credentials, send_result_retry_policy_refused, request_session_close]
    - from: awaiting_consent
      event: invalid_can_or_pin1_or_pin2
      role: proxy
      to: credential_rejected
      actions: [clear_all_active_credentials, remove_rejected_credential_and_derived_state, send_result_credential_rejected_best_effort, revoke_pair_after_credential_rejection, request_session_close_credential_rejected]
    - from: awaiting_consent
      event: safe_reads_complete
      role: proxy
      guard: profile_has_no_consequential_command
      to: result_pending
      actions: [persist_result, send_result_completed]
    - from: awaiting_consent
      event: user_approved_and_proxy_ready
      role: proxy
      guard: zero_transmissions
      to: prepared
      actions: [send_prepared]
    - from: prepared
      event: cancel_received
      role: proxy
      to: cancelled
      actions: [clear_operation_credentials, send_result_cancelled]
    - from: prepared
      event: request_expired
      role: proxy
      to: cancelled
      actions: [clear_operation_credentials, send_result_cancelled]
    - from: prepared
      event: valid_commit
      role: proxy
      guard: hash_matches
      to: committed
      actions: [durably_write_commit_before_transmission]
    - from: committed
      event: begin_card_command
      role: proxy
      guard: zero_transmissions
      to: executing
      actions: [consume_non_clonable_command, increment_transmission_count_once]
    - from: committed
      event: cancel_received
      role: proxy
      guard: proven_no_transmission
      to: cancelled
      actions: [persist_cancelled, clear_operation_credentials, send_result_cancelled]
    - from: [committed, executing]
      event: crash_recovered_without_terminal_result
      role: both
      to: ambiguous
      actions: [persist_ambiguous, prohibit_retry]
    - from: executing
      event: card_success
      role: proxy
      to: result_pending
      actions: [persist_result, clear_operation_credentials, send_result_completed]
    - from: executing
      event: invalid_can_or_pin1_or_pin2
      role: proxy
      to: credential_rejected
      actions: [clear_all_active_credentials, remove_rejected_credential_and_derived_state, send_result_credential_rejected_best_effort, revoke_pair_after_credential_rejection, request_session_close_credential_rejected]
    - from: executing
      event: card_policy_rejection
      role: proxy
      to: rejected
      actions: [clear_operation_credentials, persist_rejection, send_result_rejected]
    - from: executing
      event: card_removed_before_transmit
      role: proxy
      guard: proven_no_transmission
      to: cancelled
      actions: [persist_cancelled, clear_operation_credentials, send_result_cancelled]
    - from: executing
      event: card_removed_or_transport_uncertain
      role: proxy
      to: ambiguous
      actions: [clear_operation_credentials, persist_ambiguous, prohibit_retry, send_result_ambiguous_best_effort, request_session_close_ambiguous]
    - from: executing
      event: cancel_received
      role: proxy
      to: executing
      actions: [record_advisory_cancel]
    - from: executing
      event: session_closed_post_commit # rule X-04: the card exchange is never interrupted
      role: proxy
      to: executing
      actions: [continue_card_exchange_locally, note_result_delivery_impossible]
    - from: result_pending
      event: valid_result_ack
      role: proxy
      to: completed
      actions: [persist_completed, release_result]
    - from: result_pending
      event: session_closed_before_ack  # produced by rule X-05
      role: proxy
      to: delivery_uncertain
      actions: [persist_delivery_uncertain, prohibit_card_retry, retain_result_under_local_storage]
    - from: committed
      event: session_closed_post_commit # produced by rule X-03; proxy side proves zero transmissions
      role: proxy
      to: cancelled
      actions: [persist_cancelled, clear_operation_credentials]
    - from: requested
      event: prepared_received
      role: requester
      guard: hash_echo_matches
      to: prepared
      actions: [journal_prepared]
    - from: [requested, prepared]
      event: cancel_sent_or_request_expired
      role: requester
      to: cancelled
      actions: [send_operation_cancel, journal_cancelled]
    - from: prepared
      event: commit_sent
      role: requester
      to: committed
      actions: [journal_commit_intent_durably]
    - from: requested
      event: result_completed_received
      role: requester
      guard: profile_has_no_consequential_command
      to: completed
      actions: [send_result_ack, journal_completed]
    - from: [requested, prepared]
      event: result_denied_received
      role: requester
      to: denied
      actions: [journal_denied]
    - from: [requested, prepared, committed]
      event: result_cancelled_received
      role: requester
      to: cancelled
      actions: [journal_cancelled]
    - from: [requested, prepared, committed]
      event: result_rejected_received
      role: requester
      to: rejected
      actions: [journal_rejected]
    - from: [requested, prepared, committed]
      event: result_credential_rejected_received
      role: requester
      to: credential_rejected
      actions: [journal_credential_rejected, revoke_pair_after_credential_rejection]
    - from: committed
      event: result_completed_received
      role: requester
      to: completed
      actions: [send_result_ack, journal_completed]
    - from: committed
      event: result_ambiguous_received
      role: requester
      to: ambiguous
      actions: [journal_ambiguous, prohibit_retry]
    - from: committed
      event: session_closed_post_commit # produced by rule X-03
      role: requester
      to: ambiguous
      actions: [journal_ambiguous, prohibit_retry]
    - from: [requested, awaiting_consent, prepared]
      event: session_closed_pre_commit  # produced by rule X-02
      role: both
      to: cancelled
      actions: [clear_operation_credentials, persist_cancelled]

unexpected_input_policy:
  - class: pre_authentication_invalid_input
    applies: >
      malformed, unexpected, or unauthenticated input during pairing offers,
      connection, or any handshake, including a handshake message with a
      non-empty payload
    handling: [discard_input, close_candidate]
    emits: "handshake_failed or candidate_failure as applicable"
    pairing_effect: none
  - class: established_channel_integrity_failure
    applies: >
      a frame on an authenticated session that fails authenticated decryption
      or framing
    handling: [raise_session_integrity_failed]
    pairing_effect: >
      no blame and no end-of-pairing notice; the session closes and, because
      the pairing is its live connection, the pairing ends with it
  - class: stale_reference_race
    applies: >
      a successfully decrypted operation message for an unknown or terminal
      operation_id, a duplicate commit whose hash matches the committed
      record, or a pong whose challenge matches no outstanding ping
    handling: [discard_input, send_error_unknown_operation_if_useful]
    pairing_effect: none
  - class: authenticated_protocol_violation
    applies: >
      a successfully decrypted message with a schema violation, sequence or
      session_id violation, parameter-echo mismatch, or no legal transition
      and no stale-reference classification
    handling: [raise_authenticated_protocol_violation]
    pairing_effect: >
      the pairing ends immediately with an end-of-pairing notice and in-memory
      key destruction. On the pairing channel before confirmation completes,
      the attempt aborts via denied_aborted_or_timed_out and nothing is
      recorded
  - class: local_internal_fault
    applies: "a local invariant failure inside the RAPP implementation"
    handling: [raise_local_security_shutdown]
    pairing_effect: none
  - class: traffic_after_closed
    applies: "any frame for a closed or unknown session"
    handling: [discard_without_response]
    pairing_effect: none

cross_component_rules:
  - id: X-01
    when: pairing_leaves_paired_by_forget_or_revocation_with_live_session
    require: session_receives_close_requested_by_pairing
  - id: X-02
    when: session_enters_closing_with_operation_in_requested_awaiting_consent_or_prepared
    require: operation_receives_session_closed_pre_commit
  - id: X-03
    when: session_enters_closing_with_operation_committed
    require: requester_operation_enters_ambiguous_and_proxy_operation_enters_cancelled_with_proven_zero_transmissions
  - id: X-04
    when: session_enters_closing_with_proxy_operation_executing
    require: card_exchange_continues_locally_uninterrupted_and_unrepeated
  - id: X-05
    when: session_enters_closing_with_operation_result_pending
    require: operation_receives_session_closed_before_ack
  - id: X-06
    when: operation_enters_credential_rejected
    require: session_enters_closing_and_both_peers_drop_the_pair_on_the_first_incident
  - id: X-07
    when: operation_enters_ambiguous
    require: automatic_retry_is_permanently_false
  - id: X-08
    when: operation_admission
    require: pairing_paired_connected_and_session_healthy_and_no_active_operation
  - id: X-09
    when: pairing_ended_by_revocation_or_violation
    require: one_best_effort_authenticated_close_notice_before_key_destruction

invariants:
  - id: INV-01
    statement: no_operation_without_confirmed_pairing
  - id: INV-02
    statement: new_operations_only_while_session_healthy
  - id: INV-03
    statement: no_credential_command_before_exact_consent_and_commit
  - id: INV-04
    statement: at_most_one_active_credential_operation_per_proxy
  - id: INV-05
    statement: at_most_one_credential_command_transmission_per_operation_id
  - id: INV-06
    statement: ambiguous_completion_never_retried_automatically
  - id: INV-07
    statement: destroyed_pair_keys_never_restored_automatically
  - id: INV-08
    statement: version_suite_offer_and_transport_are_transcript_bound
  - id: INV-09
    statement: relay_never_receives_plaintext_or_credentials
  - id: INV-10
    statement: requester_never_receives_can_pin_activation_or_puk
  - id: INV-11
    statement: connected_requires_recent_authenticated_liveness
  - id: INV-12
    statement: security_connection_state_visible_on_both_peers
  - id: INV-13
    statement: no_automatic_downgrade_or_mid_operation_fallback
  - id: INV-14
    statement: session_keys_and_credential_buffers_destroyed_on_close
  - id: INV-15
    statement: local_policy_may_only_be_stricter
  - id: INV-16
    statement: invalid_can_pin1_or_pin2_closes_rapp_session
  - id: INV-17
    statement: credential_rejection_never_auto_reconnects_or_repeats
  - id: INV-18
